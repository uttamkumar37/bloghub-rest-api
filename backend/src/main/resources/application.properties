# ==============================================
# BlogHub API - Application Configuration
# ==============================================

# Application
spring.application.name=bloghub-api
server.port=8080
server.servlet.context-path=/api/v1

# ==============================================
# Database Configuration (MySQL)
# ==============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bloghub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# ==============================================
# JPA / Hibernate Configuration
# ==============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway schema migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ==============================================
# Redis Configuration
# ==============================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.cache.type=redis

# ==============================================
# JWT Configuration
# ==============================================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Bootstrap admin is disabled by default. Enable only with env-provided password.
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@bloghub.local}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# Auth protection
app.rate-limit.auth.login.limit=${AUTH_LOGIN_RATE_LIMIT:10}
app.rate-limit.auth.register.limit=${AUTH_REGISTER_RATE_LIMIT:5}
app.rate-limit.auth.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173,https://*.netlify.app,https://*.vercel.app}

# File uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.local-dir=${UPLOAD_LOCAL_DIR:uploads}
app.upload.public-base-url=${UPLOAD_PUBLIC_BASE_URL:/uploads}
app.upload.max-size-bytes=${UPLOAD_MAX_SIZE_BYTES:5242880}

# ==============================================
# SpringDoc / Swagger UI
# ==============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.packagesToScan=com.bloghub.api.controller

# ==============================================
# Actuator
# ==============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=bloghub-api
info.app.name=BlogHub API
info.app.version=1.0.0

# ==============================================
# Logging
# ==============================================
logging.level.com.bloghub=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
